<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Encyclopedia</title></head>
<body>
  <h1>The Free Encyclopedia</h1>
  <p>Welcome. Search millions of articles written by volunteers.</p>
  <form action="results.html" method="get">
    <input type="search" name="q" aria-label="Search encyclopedia" placeholder="Search">
    <button type="submit">Search</button>
  </form>
  <a href="about.html">About</a>
  <div role="button" tabindex="0">Random article</div>
  <button style="display:none">Hidden thing</button>
  <button disabled>Disabled thing</button>
  <label for="lang">Language</label>
  <select id="lang"><option>English</option><option>Deutsch</option></select>
  <textarea placeholder="Feedback"></textarea>
</body>
</html>
